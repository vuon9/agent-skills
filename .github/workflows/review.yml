name: review

# Verify the skills collection whenever a PR changes the manifest or vm.
# Reuses the opencode AI review reusable workflow (muse-spark model, the same
# setup used in devtoolbox). The reusable posts the report and converges it to a
# single comment per PR, so re-runs upsert instead of stacking. The verification
# logic lives in .agents/skills/skills-verify/SKILL.md and is handed to the
# agent as the prompt.
#
# Triggered by opened, synchronize (new commit to the branch), reopened, and
# ready_for_review, filtered to the two paths that can change the required set.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "install-vm-skills/favorites.json"
      - "vm/**"

# Only the newest run per PR executes; older in-flight runs are cancelled
# instead of stacking up notifications.
concurrency:
  group: review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Permissions MUST live on the caller job (the reusable job cannot declare
    # them, or it fails at startup). contents: write lets the agent reconcile
    # and push from the branch when it can.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: vuon9/gh-workflows/.github/workflows/ai-code-review.yml@v0.4.0
    with:
      mode: pr
      comment-marker: skills-verify
      model: opencode/muse-spark-1.2-contributor-free
      prompt: |
        Run the collection verification described in `.agents/skills/skills-verify/SKILL.md` against this PR, in this order:
        1. Read `install-vm-skills/favorites.json` and `vm/SKILL.md`.
        2. Confirm the `vm/SKILL.md` `## Required skills` list and the manifest's `required: true` set match in both directions.
        3. Validate every manifest entry: `name` matches its SKILL.md frontmatter (and folder when local), `source` is an owner/repo, a full GitHub tree URL, or `local`, `scope` is mine/external, and mine sources point at `vuon9/*`.
        4. Quality-check skills in this repo: SKILL.md frontmatter `name` uses letters/numbers/hyphens, `description` starts with "Use when", and a README.md exists next to SKILL.md.
        5. Confirm `vm/playbooks/*` and `vm/references/*` exist and are referenced.
        If the two lists diverge, reconcile: use `install-vm-skills/scripts/manage.py add|remove|set-required`, and update the `vm/SKILL.md` `## Required skills` list. If the runner can safely edit the branch, apply and push; otherwise list the exact commands and the vm edit.
        Post a SHORT comment report (about 6 to 12 lines): what the PR changed (added, removed, or re-scoped skills), any mismatch found and how it was reconciled (or the exact command the author should run), and the pass or fail verdict. Edit your previous comment instead of adding a new one.
    secrets:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
